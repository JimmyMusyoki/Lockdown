name: Build and Release Lockdown Blocker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (example: 1.1.8)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set application version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Current package version: $CURRENT_VERSION"
          echo "Requested release version: $VERSION"

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          else
            echo "Version $VERSION already set in package.json."
            echo "Skipping version update."
          fi

      - name: Build and publish Electron application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
